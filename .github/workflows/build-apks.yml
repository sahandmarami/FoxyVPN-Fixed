name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build FoxyVPN (main app) v2.3.0
        working-directory: android-app
        env:
          SIGNING_STORE_PASSWORD: foxyvpn
          SIGNING_KEY_ALIAS: foxyvpn
          SIGNING_KEY_PASSWORD: foxyvpn
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build FoxyKeygen v1.4.0
        working-directory: keygen-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/release/app-release.apk out/FoxyVPN-v2.3.0.apk
          cp keygen-app/app/build/outputs/apk/release/app-release.apk out/FoxyKeygen-v1.4.0.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-APKs
          path: out/*.apk
          if-no-files-found: error
